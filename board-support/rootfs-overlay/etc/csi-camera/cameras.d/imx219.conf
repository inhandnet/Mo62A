# IMX219 CSI camera descriptor for csi-camera-demo
# DTBO selection is handled separately by: bootcfg switch microSD-cam
#
# ID     machine-readable identifier (must match filename <id>.conf)
# NAME   human-readable name
# INIT   on-demand media-ctl init command (run manually or by csi-camera-demo)
# VIDEO  stable video node symlink (created by INIT)
# SUBDEV stable subdev node symlink (created by INIT)
# WIDTH/HEIGHT/FORMAT/FRAMERATE  sensor output parameters

ID=imx219
NAME="IMX219 camera module (CSI0)"
INIT=/usr/local/bin/init-imx219
VIDEO=/dev/video-imx219-cam0
SUBDEV=/dev/v4l-imx219-subdev0
WIDTH=1920
HEIGHT=1080
FORMAT=rggb
FRAMERATE=30
