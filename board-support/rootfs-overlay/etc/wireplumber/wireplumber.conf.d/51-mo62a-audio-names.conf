# Give the Mo62A ALSA endpoints distinct names in PipeWire clients such as
# pavucontrol.  The codec and HDMI cards otherwise both appear as
# "Built-in Audio Stereo", which makes output selection ambiguous.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        device.description = "Mo62A Analog Audio"
        device.nick = "Mo62A Analog Audio"
      }
    }
  }
  {
    matches = [
      { device.name = "alsa_card.platform-sound-hdmi" }
    ]
    actions = {
      update-props = {
        device.description = "Mo62A HDMI Audio"
        device.nick = "Mo62A HDMI Audio"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.platform-sound.stereo-fallback" }
    ]
    actions = {
      update-props = {
        node.description = "Mo62A Headset Output"
        node.nick = "Mo62A Headset Output"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.platform-sound.stereo-fallback" }
    ]
    actions = {
      update-props = {
        node.description = "Mo62A Headset Microphone"
        node.nick = "Mo62A Headset Microphone"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.platform-sound-hdmi.stereo-fallback" }
    ]
    actions = {
      update-props = {
        node.description = "Mo62A HDMI Output"
        node.nick = "Mo62A HDMI Output"
      }
    }
  }
]
