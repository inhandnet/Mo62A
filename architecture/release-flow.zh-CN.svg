<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 835" role="img" aria-labelledby="title desc"><title id="title">发布组成清单与网站晋级</title><desc id="desc">目标流程 · 冻结、晋级与整站部署须经实际验收</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#548879"/></marker></defs><rect width="1200" height="835" rx="18" fill="#f4f8f5"/><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="14" fill="#007458" font-weight="700">MO / MO62A</text><text x="40" y="91" font-size="30" fill="#173d32" font-weight="700">发布组成清单与网站晋级</text><text x="40" y="124" font-size="17" fill="#59716a" font-weight="400">目标流程 · 冻结、晋级与整站部署须经实际验收</text><rect x="40" y="176" width="360" height="254" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="60" y="220" font-size="25" fill="#007458" font-weight="700">源仓库普通发布</text><text x="60" y="266" font-size="17" fill="#203b36" font-weight="400">主题 PR → 必需 CI → 合并</text><text x="60" y="293" font-size="17" fill="#203b36" font-weight="400">普通附注标签 VX.Y.Z</text><text x="60" y="320" font-size="17" fill="#203b36" font-weight="400">源码 / 内容 / 元信息 / 哈希</text><text x="60" y="347" font-size="17" fill="#203b36" font-weight="400">历史标签与发布物不改写</text><path d="M400 306h17" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="176" width="360" height="254" rx="14" fill="#e5f3eb" stroke="#cbdcd5"/><text x="440" y="220" font-size="25" fill="#007458" font-weight="700">developer RC</text><text x="440" y="266" font-size="17" fill="#203b36" font-weight="400">RC 标签 VX.Y.Z-rcN</text><text x="440" y="293" font-size="17" fill="#203b36" font-weight="400">首次解析合格普通版本</text><text x="440" y="320" font-size="17" fill="#203b36" font-weight="400">构建前持久冻结组成清单</text><text x="440" y="347" font-size="17" fill="#203b36" font-weight="400">同标签重试复用固定组合</text><path d="M780 306h17" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="800" y="176" width="360" height="254" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="820" y="220" font-size="25" fill="#007458" font-weight="700">developer 正式版</text><text x="820" y="266" font-size="17" fill="#203b36" font-weight="400">显式指定已验收 RC</text><text x="820" y="293" font-size="17" fill="#203b36" font-weight="400">前端源码与子库组合不变</text><text x="820" y="320" font-size="17" fill="#203b36" font-weight="400">记录来源 RC 与清单哈希</text><text x="820" y="347" font-size="17" fill="#203b36" font-weight="400">组合变化必须进入新 RC</text><path d="M600 430V455H980V430" fill="none" stroke="#548879" stroke-width="2"/><path d="M790 455V477" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="480" width="1120" height="152" rx="14" fill="#edf2f8" stroke="#cbdcd5"/><text x="64" y="520" font-size="23" fill="#173d32" font-weight="700">Release 与 Changelog 由同一组成清单生成</text><text x="64" y="561" font-size="18" fill="#203b36" font-weight="400">完整组成表 + 清单 JSON + 所消费内容快照 + 网站包与 SHA-256</text><text x="64" y="588" font-size="18" fill="#203b36" font-weight="400">RC → .online 验收；正式版 → .com 验收；两环境按地址分别构建</text><rect x="40" y="669" width="1120" height="126" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="64" y="709" font-size="18" fill="#203b36" font-weight="400">按完整站点原子部署与回滚，保留旧路径和附件兼容</text><text x="64" y="736" font-size="18" fill="#203b36" font-weight="400">网页版本不自动扩大 SDK、模型或教程的验证范围；正式设施未就绪不能宣称上线</text></g></svg>
