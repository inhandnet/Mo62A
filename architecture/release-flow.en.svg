<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 835" role="img" aria-labelledby="title desc"><title id="title">Release composition and website promotion</title><desc id="desc">Target workflow · freezing, promotion and full-site deployment require acceptance</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#548879"/></marker></defs><rect width="1200" height="835" rx="18" fill="#f4f8f5"/><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="14" fill="#007458" font-weight="700">MO / MO62A</text><text x="40" y="91" font-size="30" fill="#173d32" font-weight="700">Release composition and website promotion</text><text x="40" y="124" font-size="17" fill="#59716a" font-weight="400">Target workflow · freezing, promotion and full-site deployment require acceptance</text><rect x="40" y="176" width="360" height="254" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="60" y="220" font-size="25" fill="#007458" font-weight="700">Ordinary source release</text><text x="60" y="266" font-size="17" fill="#203b36" font-weight="400">Topic PR → required CI → merge</text><text x="60" y="293" font-size="17" fill="#203b36" font-weight="400">Annotated ordinary VX.Y.Z</text><text x="60" y="320" font-size="17" fill="#203b36" font-weight="400">Source / content / metadata / hashes</text><text x="60" y="347" font-size="17" fill="#203b36" font-weight="400">Published tags and assets retained</text><path d="M400 306h17" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="176" width="360" height="254" rx="14" fill="#e5f3eb" stroke="#cbdcd5"/><text x="440" y="220" font-size="25" fill="#007458" font-weight="700">developer RC</text><text x="440" y="266" font-size="17" fill="#203b36" font-weight="400">Tag VX.Y.Z-rcN</text><text x="440" y="293" font-size="17" fill="#203b36" font-weight="400">Resolve ordinary source releases</text><text x="440" y="320" font-size="17" fill="#203b36" font-weight="400">Persist composition before building</text><text x="440" y="347" font-size="17" fill="#203b36" font-weight="400">Retry the same tag with fixed inputs</text><path d="M780 306h17" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="800" y="176" width="360" height="254" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="820" y="220" font-size="25" fill="#007458" font-weight="700">developer final</text><text x="820" y="266" font-size="17" fill="#203b36" font-weight="400">Explicitly select an accepted RC</text><text x="820" y="293" font-size="17" fill="#203b36" font-weight="400">Same frontend and source combination</text><text x="820" y="320" font-size="17" fill="#203b36" font-weight="400">Record source RC and manifest hash</text><text x="820" y="347" font-size="17" fill="#203b36" font-weight="400">Changed inputs require a new RC</text><path d="M600 430V455H980V430" fill="none" stroke="#548879" stroke-width="2"/><path d="M790 455V477" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="480" width="1120" height="152" rx="14" fill="#edf2f8" stroke="#cbdcd5"/><text x="64" y="520" font-size="23" fill="#173d32" font-weight="700">Release and Changelog derive from the same composition</text><text x="64" y="561" font-size="18" fill="#203b36" font-weight="400">Complete version table + manifest JSON + consumed-source snapshot + website archive / SHA-256</text><text x="64" y="588" font-size="18" fill="#203b36" font-weight="400">RC → .online acceptance; final → .com acceptance; build separately for each origin</text><rect x="40" y="669" width="1120" height="126" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="64" y="709" font-size="18" fill="#203b36" font-weight="400">Deploy and roll back the complete site atomically; retain old routes and attachments</text><text x="64" y="736" font-size="18" fill="#203b36" font-weight="400">A website version adds no SDK, model or tutorial qualification. Production needs real infrastructure.</text></g></svg>
