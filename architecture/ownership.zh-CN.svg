<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 685" role="img" aria-labelledby="title desc"><title id="title">Mo62A：维护边界与交付关系</title><desc id="desc">目录展示维护职责，具体迁移完成度见 README</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#548879"/></marker></defs><rect width="1200" height="685" rx="18" fill="#f4f8f5"/><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="14" fill="#007458" font-weight="700">MO / MO62A</text><text x="40" y="91" font-size="30" fill="#173d32" font-weight="700">Mo62A：维护边界与交付关系</text><text x="40" y="124" font-size="17" fill="#59716a" font-weight="400">目录展示维护职责，具体迁移完成度见 README</text><rect x="40" y="182" width="360" height="310" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="62" y="229" font-size="23" fill="#203b36" font-weight="400">产品 BSP 与系统镜像</text><text x="62" y="282" font-size="17" fill="#203b36" font-weight="400">启动链、内核和根文件系统</text><text x="62" y="309" font-size="17" fill="#203b36" font-weight="400">驱动与板端系统集成</text><text x="62" y="336" font-size="17" fill="#203b36" font-weight="400">镜像构建和烧录</text><text x="62" y="363" font-size="17" fill="#203b36" font-weight="400">release.json 与镜像校验值</text><path d="M400 339h17" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="182" width="360" height="310" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="442" y="229" font-size="23" fill="#203b36" font-weight="400">本仓库交付</text><text x="442" y="282" font-size="17" fill="#203b36" font-weight="400">目录 / 内容与自身业务校验</text><text x="442" y="309" font-size="17" fill="#203b36" font-weight="400">普通 VX.Y.Z Release</text><text x="442" y="336" font-size="17" fill="#203b36" font-weight="400">明确依赖、许可与验证范围</text><path d="M780 339h17" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="800" y="182" width="360" height="310" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="822" y="229" font-size="23" fill="#203b36" font-weight="400">developer 消费</text><text x="822" y="282" font-size="17" fill="#203b36" font-weight="400">组成清单固定准确版本</text><text x="822" y="309" font-size="17" fill="#203b36" font-weight="400">按需读取内容及元信息</text><text x="822" y="336" font-size="17" fill="#203b36" font-weight="400">统一渲染与网站发布</text><rect x="40" y="533" width="1120" height="110" rx="14" fill="#e5f3eb" stroke="#cbdcd5"/><text x="64" y="572" font-size="17" fill="#203b36" font-weight="400">教程组织在 mo-docs；可执行资源按职责维护；网站从固定版本组装展示与下载</text><text x="64" y="599" font-size="17" fill="#203b36" font-weight="400">同一份实现只维护一次，关联固件、客户端、配置和验证资源保持配套</text></g></svg>
