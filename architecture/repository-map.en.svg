<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc"><title id="title">Mo series: separate sources, one website</title><desc id="desc">Architecture target · see README for migration status and remaining work</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#548879"/></marker></defs><rect width="1200" height="910" rx="18" fill="#f4f8f5"/><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="14" fill="#007458" font-weight="700">MO / MO62A</text><text x="40" y="91" font-size="30" fill="#173d32" font-weight="700">Mo series: separate sources, one website</text><text x="40" y="124" font-size="17" fill="#59716a" font-weight="400">Architecture target · see README for migration status and remaining work</text><text x="40" y="166" font-size="17" fill="#007458" font-weight="700">GitHub · independent source ownership and ordinary releases</text><rect x="40" y="192" width="216" height="170" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="56" y="229" font-size="24" fill="#173d32" font-weight="700">mo-docs</text><text x="56" y="265" font-size="16" fill="#203b36" font-weight="400">Software + hardware</text><text x="56" y="292" font-size="16" fill="#203b36" font-weight="400">docs</text><text x="56" y="319" font-size="16" fill="#203b36" font-weight="400">Media, facts and</text><text x="56" y="346" font-size="16" fill="#203b36" font-weight="400">references</text><path d="M148 362V394" fill="none" stroke="#548879" stroke-width="2"/><rect x="266" y="192" width="216" height="170" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="282" y="229" font-size="24" fill="#173d32" font-weight="700">mo-tools</text><text x="282" y="265" font-size="16" fill="#203b36" font-weight="400">Toolchains and tools</text><text x="282" y="292" font-size="16" fill="#203b36" font-weight="400">Host setup, diagnostics</text><p