>Pinned sources → compatibility checks → .generated/ → one Docusaurus build</text><text x="64" y="577" font-size="18" fill="#203b36" font-weight="400">Shared components, navigation, search, source traceability and downloads</text><path d="M600 621V659" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="664" width="1120" height="120" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="64" y="701" font-size="24" fill="#173d32" font-weight="700">One complete website artifact</text><text x="64" y="739" font-size="21" fill="#007458" font-weight="400">/  ·  /docs/  ·  /tools/  ·  /models/  ·  /examples/</text><text x="40" y="827" font-size="17" fill="#203b36" font-weight="400">mo-hardware → mo-docs/hardware/: migrate content and training; retain /hardware-docs/ compatibility</text><text x="40" y="854" font-size="17" fill="#203b36" font-weight="400">Composition = developer + mo-docs + mo-tools + mo-models + mo-examples + selected Mo*</text></g></svg>
